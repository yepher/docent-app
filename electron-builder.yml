appId: com.yepher.docent
productName: Docent
artifactName: ${name}-${version}-${os}-${arch}.${ext}
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
# The sidecar for the platform being built. scripts/fetch-llama.mjs fills this.
extraResources:
  - from: vendor/llama/current
    to: llama
    filter: ['**/*']
  - from: vendor/THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
publish:
  provider: github
  owner: yepher
  repo: docent-app
mac:
  category: public.app-category.productivity
  target:
    - { target: dmg, arch: [arm64, x64] }
    - { target: zip, arch: [arm64, x64] } # electron-updater needs the zip on macOS
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Docent uses the microphone for voice questions. Audio is processed on this computer.
win:
  target: [{ target: nsis, arch: [x64] }]
nsis:
  oneClick: true
  perMachine: false
linux:
  category: Utility
  target:
    - { target: AppImage, arch: [x64] } # AppImage is the auto-updating Linux format
    - { target: deb, arch: [x64] }
  maintainer: Docent contributors <claude@yepher.com>
