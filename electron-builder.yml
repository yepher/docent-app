appId: com.yepher.docent
productName: Docent
artifactName: ${name}-${version}-${os}-${arch}.${ext}
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
  - build/icon.png
# The sidecar matching each build. scripts/fetch-llama.mjs fills these folders.
extraResources:
  - from: vendor/llama/${platform}-${arch}
    to: llama
    filter: ['**/*']
  - from: vendor/THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
publish:
  provider: github
  owner: yepher
  repo: docent-app
asarUnpack:
  - node_modules/@napi-rs/**
  - node_modules/tesseract.js/**
  - node_modules/tesseract.js-core/**
  - node_modules/@tesseract.js-data/**
mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  # No arch lists on targets: they override --arm64/--x64 on the command line.
  target:
    - dmg
    - zip # electron-updater needs the zip on macOS
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Docent uses the microphone for voice questions. Audio is processed on this computer.
    CFBundleDocumentTypes:
      - CFBundleTypeName: Documents and folders for Docent
        CFBundleTypeRole: Viewer
        LSHandlerRank: Alternate
        LSItemContentTypes: [public.data, public.folder]
win:
  icon: build/icon.ico
  target: [nsis]
nsis:
  oneClick: true
  perMachine: false
linux:
  icon: build/icon.png
  category: Utility
  target:
    - AppImage # the auto-updating Linux format
    - deb
  maintainer: Docent contributors <claude@yepher.com>
