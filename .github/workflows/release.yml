# Push a tag such as v0.2.0 to build every platform and publish a GitHub Release.
# Installed apps discover it through electron-updater.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  # The draft exists first, so parallel builds cannot each create their own release.
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Docent ${GITHUB_REF_NAME#v}" --notes-file .github/release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build:
    needs: draft
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both Mac builds run together: they share latest-mac.yml, which a second job would overwrite.
          - { os: macos-latest, llama: darwin-arm64 darwin-x64, flags: --mac --arm64 --x64 }
          - { os: windows-latest, llama: win32-x64, flags: --win --x64 }
          - { os: ubuntu-22.04, llama: linux-x64, flags: --linux --x64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/fetch-llama.mjs ${{ matrix.llama }}
      - run: npx electron-builder ${{ matrix.flags }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing. Without these the build is unsigned and macOS cannot auto-update.
          # Mac only: electron-builder would otherwise try to sign Windows builds with this certificate.
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CERTIFICATE_P12_BASE64 || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  # Testers only see a release once every platform has built.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
